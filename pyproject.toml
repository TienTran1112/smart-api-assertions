# Python is used only for analysis (plan 3.6): family split, kappa, embedding baseline and the
# statistics notebook. The tests and the judge are TypeScript (package.json).
[project]
name = "smart-assert-analysis"
version = "0.1.0"
description = "Analysis scripts and notebook for the smart-assert capstone"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "sentence-transformers>=3",
    "jupyter>=1",
]
