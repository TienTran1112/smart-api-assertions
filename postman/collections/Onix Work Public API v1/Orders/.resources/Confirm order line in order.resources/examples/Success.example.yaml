$kind: http-example
request:
  url: "{{baseUrl}}/v1/orders/confirm-order-lines"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "orderImportId": "string",
        "orderLineImportIds": [
          "string",
          "string"
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "true"
order: 1000
