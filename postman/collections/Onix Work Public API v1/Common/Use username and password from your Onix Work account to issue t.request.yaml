$kind: http-request
name: Use username and password from your Onix Work account to issue the short-lived token.
description: The result is the access and it will be expired after 60 minutes
url: "{{baseUrl}}/v1/Account/token"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "string",
      "username": "string"
    }
settings: {}
examples: ./.resources/Use username and password from your Onix Work account to issue t.resources/examples
order: 1000
