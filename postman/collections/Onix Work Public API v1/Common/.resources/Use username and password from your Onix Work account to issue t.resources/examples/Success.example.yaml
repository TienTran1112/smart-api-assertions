$kind: http-example
request:
  url: "{{baseUrl}}/v1/Account/token"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "password": "string",
        "username": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 1000
