$kind: http-example
request:
  url: "{{baseUrl}}/v1/order-lines/form-properties"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "orderId": 7050,
        "orderImportId": "string",
        "orderLineId": 5992,
        "orderLineImportId": "st",
        "properties": [
          {
            "key": "string",
            "value": "string"
          },
          {
            "key": "string",
            "value": "s"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "true"
order: 1000
