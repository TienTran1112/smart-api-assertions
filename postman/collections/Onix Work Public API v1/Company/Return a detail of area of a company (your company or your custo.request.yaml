  \        <br/><b>companyId</b>\r

  \        <br/>- Can use value from `GET /company`\r

  \        <br/><b>areaId</b>\r

  \        <br/>- Can use value from `GET /company/{companyId}/areas`\r

  \        <br/>- Valid value: the area must belong to the company.\r

  \        <br/>\r

  \        <br/><u>Result</u>: an `AreaInfo`\r

  \        <br/>\r

  \        <br/><u>Note</u>:\r

  \        <br/>+ To limit which fields will be returned, use `$select` in query string (e.g: $select=fieldName1,fieldName2).\r

  \        "
