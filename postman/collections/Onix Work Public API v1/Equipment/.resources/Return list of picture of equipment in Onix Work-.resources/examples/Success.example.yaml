$kind: http-example
request:
  url: "{{baseUrl}}/v1/equipment/:equipmentId/pictures"
  method: GET
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: equipmentId
      value: "1507"
      disabled: false
      description: "(Required) "
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      [
        {
          "pictureInfoId": 5142,
          "description": "string",
          "isDefaultPicture": true,
          "contentType": "string",
          "viewerUrl": "string"
        },
        {
          "pictureInfoId": 5742,
          "description": "string",
          "isDefaultPicture": false,
          "contentType": "string",
          "viewerUrl": "string"
        }
      ]
order: 1000
