$kind: http-example
request:
  url: "{{baseUrl}}/v1/equipment/:equipmentId/issues"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  pathVariables:
    - key: equipmentId
      value: "1507"
      disabled: false
      description: "(Required) "
  body:
    type: json
    content: |-
      {
        "id": 9765,
        "importId": "string",
        "issueStatusId": 9654,
        "description": "string",
        "comment": "string",
        "dueDate": "string",
        "solution": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "1507"
order: 1000
