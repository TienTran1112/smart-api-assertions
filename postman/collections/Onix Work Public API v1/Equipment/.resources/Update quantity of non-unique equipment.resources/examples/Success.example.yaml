$kind: http-example
request:
  url: "{{baseUrl}}/v1/equipment/quantity-adjustment"
  method: POST
  headers:
    - key: Authorization
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "locationId": 560,
        "productId": 2439,
        "quantity": 631
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: "1507"
order: 1000
